<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press Coverage</title>
  <!-- Repository that stores config + data. Auto-detected on *.github.io; set here for other hosts. -->
  <meta name="gpc-repo" content="mjramos86/gamepresscoverage">
  <link rel="stylesheet" href="web/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#coverage"><span class="logo" aria-hidden="true"></span><strong>Press Coverage</strong></a>
    <select id="project" aria-label="Game"></select>
    <div class="seg" id="range" role="group" aria-label="Period">
      <button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button><button data-days="365">1 year</button>
    </div>
    <div class="spacer"></div>
    <button id="checkBtn" class="btn needs-write" title="Search every source for new coverage right now">↻ Check for new coverage</button>
    <button id="reportBtn" class="btn primary">Create report</button>
  </header>

  <div id="statusbar" class="statusbar"></div>

  <nav class="tabs" id="tabs">
    <a href="#coverage" data-view="coverage">Coverage</a>
    <a href="#streams" data-view="streams">Live streams</a>
    <a href="#review" data-view="review" class="needs-write">To review <span id="reviewCount" class="pill"></span></a>
    <a href="#add" data-view="add" class="needs-write">+ Add coverage</a>
    <a href="#settings" data-view="settings">⚙ Settings</a>
  </nav>

  <main id="view"></main>

  <dialog id="reportDialog">
    <form method="dialog" class="dialog">
      <h2>Create a coverage report</h2>
      <p class="muted">A branded, bilingual report for your client. Open it, then use <b>Print → Save as PDF</b> if you need a PDF.</p>
      <div class="grid2">
        <label>From<input type="date" name="from" required></label>
        <label>To<input type="date" name="to" required></label>
      </div>
      <label>Language shown first
        <select name="lang"><option value="fr">Français</option><option value="en">English</option></select>
      </label>
      <div class="row end">
        <button value="cancel" class="btn" formnovalidate>Cancel</button>
        <button value="download" class="btn">Download file</button>
        <button value="open" class="btn primary">Open report</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="web/app.js" type="module"></script>
</body>
</html>
