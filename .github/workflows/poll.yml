name: Poll coverage

# Runs every 30 minutes, whenever settings are changed from the dashboard (config/ on main),
# and when "Check for new coverage" is clicked. Each source keeps its own minimum interval.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths: ["config/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore per-source intervals and check everything now"
        type: boolean
        default: false

permissions:
  contents: write   # to save the database + data.json on the coverage-data branch

concurrency:
  group: poll-coverage
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PATH: data/coverage.db
      # Every repository secret (API keys, webhooks) is made available to the app;
      # keys added from the dashboard work without editing this file.
      ALL_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always use the latest settings, whatever the default branch is
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth=1 origin coverage-data 2>/dev/null; then
            git show FETCH_HEAD:coverage.db > data/coverage.db 2>/dev/null || rm -f data/coverage.db
          fi

      - name: Check sources
        run: npm run poll -- ${{ inputs.force && '--force' || '' }}

      - name: Build data for the dashboard
        run: npm run export

      - name: Save (single-commit coverage-data branch, no history bloat)
        run: |
          cp data/coverage.db data/data.json "$RUNNER_TEMP/"
          git config user.name "coverage-bot"
          git config user.email "coverage-bot@users.noreply.github.com"
          git switch --orphan coverage-data-tmp
          cp "$RUNNER_TEMP/coverage.db" "$RUNNER_TEMP/data.json" .
          git add -f coverage.db data.json
          git commit -q -m "Coverage snapshot $(date -u +%FT%TZ)"
          git push -q -f origin HEAD:coverage-data
