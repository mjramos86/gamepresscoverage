name: Poll coverage

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min; each source has its own minimum interval (see src/poll.js)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore per-source intervals"
        type: boolean
        default: false

permissions:
  contents: write   # to push the SQLite DB to the coverage-data branch
  pages: write
  id-token: write

concurrency:
  group: poll-coverage
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PATH: data/coverage.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COVERAGE_MODEL: ${{ vars.COVERAGE_MODEL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Per-project webhooks: add one line per env name referenced in config/projects.json
      DISCORD_WEBHOOK_SOLITAIRE_TOWER: ${{ secrets.DISCORD_WEBHOOK_SOLITAIRE_TOWER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore database from coverage-data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin coverage-data 2>/dev/null; then
            git show FETCH_HEAD:coverage.db > data/coverage.db
            echo "Restored $(du -h data/coverage.db | cut -f1) database"
          else
            echo "No coverage-data branch yet; starting a fresh database"
          fi

      - name: Poll sources
        run: npm run poll -- ${{ inputs.force && '--force' || '' }}

      - name: Build static dashboard + reports
        run: npm run export

      - name: Save database (single-commit orphan branch, no history bloat)
        run: |
          cp data/coverage.db "$RUNNER_TEMP/coverage.db"
          git config user.name "coverage-bot"
          git config user.email "coverage-bot@users.noreply.github.com"
          git switch --orphan coverage-data-tmp
          cp "$RUNNER_TEMP/coverage.db" coverage.db
          git add -f coverage.db
          git commit -q -m "Coverage DB snapshot $(date -u +%FT%TZ)"
          git push -q -f origin HEAD:coverage-data

      - name: Upload dashboard snapshot (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dashboard
          path: site
          retention-days: 7

      # Publishing to GitHub Pages makes the dashboard PUBLIC (even for private repos on most plans).
      # Opt in by setting the repository variable PUBLISH_DASHBOARD=true.
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_DASHBOARD == 'true'
        with:
          path: site

  deploy-pages:
    needs: poll
    if: vars.PUBLISH_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
